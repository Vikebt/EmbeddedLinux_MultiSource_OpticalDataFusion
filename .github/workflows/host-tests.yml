name: Host regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reject embedded authenticated RTSP URLs
        run: |
          if git grep -q 'rtsp://.*@' -- src/mainwindow/include src/mainwindow/src; then
            echo 'Authenticated RTSP URLs must not be committed to source.' >&2
            exit 1
          fi
      - name: Install YAML dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev
      - name: Debug build and tests
        run: |
          cmake -S src/mainwindow/tests/host -B build/ci-debug -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/ci-debug --parallel 2
          ctest --test-dir build/ci-debug -N | grep yaml_config_transaction
          ctest --test-dir build/ci-debug -N | grep navigation_datagram
          ctest --test-dir build/ci-debug -N | grep rtsp_url_config
          ctest --test-dir build/ci-debug --output-on-failure
      - name: Release build and tests
        run: |
          cmake -S src/mainwindow/tests/host -B build/ci-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-release --parallel 2
          ctest --test-dir build/ci-release -N | grep yaml_config_transaction
          ctest --test-dir build/ci-release -N | grep navigation_datagram
          ctest --test-dir build/ci-release -N | grep rtsp_url_config
          ctest --test-dir build/ci-release --output-on-failure
